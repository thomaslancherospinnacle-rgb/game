<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA Manager - Team Selection</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(to bottom, #0a1520 0%, #152030 50%, #1a2838 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Stadium background blur */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect fill="%23081218" width="1200" height="800"/><ellipse cx="600" cy="700" rx="400" ry="200" fill="%23163020" opacity="0.3"/></svg>') center/cover;
            filter: blur(8px);
            opacity: 0.4;
            z-index: 0;
        }

        /* Loading */
        .loading-screen {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
        }
        .loading-screen.hidden { display: none; }
        .loading-spinner {
            width: 80px; height: 80px;
            border: 4px solid rgba(0,212,255,0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 30px; font-size: 1.5rem; color: #00d4ff; font-weight: 700; letter-spacing: 2px; }
        .loading-progress { margin-top: 15px; font-size: 1rem; color: rgba(255,255,255,0.6); }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 40px;
            padding: 40px;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .container.visible { opacity: 1; }

        /* Left panel - Team selector */
        .team-selector {
            width: 420px;
            background: rgba(15, 25, 40, 0.92);
            border: 2px solid rgba(255,217,0,0.3);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .selector-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffd900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        /* Flag display */
        .flag-display {
            width: 220px;
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.3);
            border: 3px solid rgba(255,217,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .flag-display img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .flag-placeholder {
            font-size: 4rem;
        }

        /* Star rating */
        .star-rating {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .star {
            font-size: 2.2rem;
            color: #ffd900;
            text-shadow: 0 0 10px rgba(255,217,0,0.5);
        }

        /* Team stats (ATT/MID/DEF) */
        .team-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 10px 20px;
            min-width: 80px;
        }
        .stat-label {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
        }

        /* Team name selector with arrows */
        .team-name-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        .arrow-btn {
            background: rgba(255,217,0,0.15);
            border: 2px solid rgba(255,217,0,0.4);
            color: #ffd900;
            width: 40px;
            height: 40px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .arrow-btn:hover {
            background: rgba(255,217,0,0.3);
            border-color: #ffd900;
            transform: scale(1.05);
        }
        .team-name-display {
            flex: 1;
            background: linear-gradient(135deg, rgba(255,217,0,0.2), rgba(255,180,0,0.2));
            border: 2px solid rgba(255,217,0,0.5);
            border-radius: 8px;
            padding: 10px 15px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* League and club name */
        .league-club-display {
            text-align: center;
            margin-bottom: 20px;
        }
        .league-name {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }
        .club-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #00d4ff;
        }

        /* Advance button */
        .advance-btn {
            width: 100%;
            background: linear-gradient(135deg, #00d4ff, #0096ff);
            border: none;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(0,212,255,0.4);
        }
        .advance-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,212,255,0.6);
        }

        /* Right panel - Team information */
        .team-info {
            width: 520px;
            background: rgba(15, 25, 40, 0.92);
            border: 2px solid rgba(0,212,255,0.3);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffd900;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Finances section */
        .finances-section {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 8px;
            padding: 16px;
        }
        .finances-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .finance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .finance-row:last-child { border-bottom: none; }
        .finance-label {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.6);
        }
        .finance-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #39ff14;
        }

        /* Starting 11 section */
        .starting-11-section {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 8px;
            padding: 16px;
            flex: 1;
            overflow-y: auto;
        }
        .starting-11-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .starting-11-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .player-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.03);
            transition: background 0.15s;
        }
        .player-row:hover { background: rgba(255,255,255,0.06); }
        .position-badge {
            width: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            padding: 3px 0;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .position-badge.gk  { background: rgba(255,180,0,0.8); }
        .position-badge.def { background: rgba(0,200,100,0.8); }
        .position-badge.mid { background: rgba(0,150,255,0.8); }
        .position-badge.att { background: rgba(255,50,100,0.8); }
        .player-name {
            flex: 1;
            font-size: 0.95rem;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
        }

        /* Bottom hints */
        .bottom-hints {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 100;
        }
        .hint {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
        }
        .hint-icon {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
        }

        @media (max-width: 1100px) {
            .container { flex-direction: column; gap: 20px; padding: 20px; }
            .team-selector, .team-info { width: 100%; max-width: 500px; }
        }
    </style>
</head>
<body>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div class="loading-text">LOADING FIFA MANAGER</div>
    <div class="loading-progress" id="loadingProgress">Initializing...</div>
</div>

<!-- Main container -->
<div class="container" id="mainContainer">
    <!-- Left panel - Team selector -->
    <div class="team-selector">
        <div class="selector-title">SELECT TEAM</div>
        
        <div class="flag-display" id="flagDisplay">
            <div class="flag-placeholder">🏴</div>
        </div>

        <div class="star-rating" id="starRating">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
        </div>

        <div class="team-stats">
            <div class="stat-box">
                <div class="stat-label">ATT</div>
                <div class="stat-value" id="attStat">—</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">MID</div>
                <div class="stat-value" id="midStat">—</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">DEF</div>
                <div class="stat-value" id="defStat">—</div>
            </div>
        </div>

        <div class="team-name-selector">
            <button class="arrow-btn" onclick="previousTeam()">◀</button>
            <div class="team-name-display" id="teamNameDisplay">—</div>
            <button class="arrow-btn" onclick="nextTeam()">▶</button>
        </div>

        <div class="league-club-display">
            <div class="league-name" id="leagueDisplay">—</div>
            <div class="club-name" id="clubDisplay">—</div>
        </div>

        <button class="advance-btn" onclick="startGame()">⏩ ADVANCE</button>
    </div>

    <!-- Right panel - Team information -->
    <div class="team-info">
        <div class="info-title">TEAM INFORMATION</div>

        <div class="finances-section">
            <div class="finances-title">FINANCES</div>
            <div class="finance-row">
                <div class="finance-label">Transfer Budget</div>
                <div class="finance-value" id="transferBudget">—</div>
            </div>
            <div class="finance-row">
                <div class="finance-label">Weekly Wages</div>
                <div class="finance-value" id="weeklyWages">—</div>
            </div>
        </div>

        <div class="starting-11-section">
            <div class="starting-11-title">STARTING 11</div>
            <div class="starting-11-list" id="starting11List">
                <div style="text-align:center;color:rgba(255,255,255,0.3);padding:20px;">Loading squad...</div>
            </div>
        </div>
    </div>
</div>

<!-- Bottom hints -->
<div class="bottom-hints">
    <div class="hint">
        <div class="hint-icon">⏩</div>
        <span>Advance</span>
    </div>
    <div class="hint">
        <div class="hint-icon">◀</div>
        <span>Back</span>
    </div>
    <div class="hint">
        <div class="hint-icon">d</div>
        <span>Swap Teams</span>
    </div>
</div>

<script>
// State
let allTeams = [];
let allPlayers = [];
let currentIndex = 0;
let dataLoaded = false;

// Country code to flag emoji mapping (simplified - extend as needed)
const countryFlags = {
    'England': '🏴󠁧󠁢󠁥󠁮󠁧󠁿',
    'Spain': '🇪🇸',
    'Germany': '🇩🇪',
    'Italy': '🇮🇹',
    'France': '🇫🇷',
    'Portugal': '🇵🇹',
    'Netherlands': '🇳🇱',
    'Belgium': '🇧🇪',
    'Brazil': '🇧🇷',
    'Argentina': '🇦🇷',
    'United States': '🇺🇸',
    'Mexico': '🇲🇽',
    'Japan': '🇯🇵',
    'South Korea': '🇰🇷',
    'Australia': '🇦🇺',
    'Saudi Arabia': '🇸🇦',
    'Turkey': '🇹🇷',
    'Poland': '🇵🇱',
    'Scotland': '🏴󠁧󠁢󠁳󠁣󠁴󠁿',
    'Wales': '🏴󠁧󠁢󠁷󠁬󠁳󠁿',
    'Austria': '🇦🇹',
    'Switzerland': '🇨🇭',
    'Denmark': '🇩🇰',
    'Sweden': '🇸🇪',
    'Norway': '🇳🇴'
};

// Load data
async function loadAllData() {
    try {
        document.getElementById('loadingProgress').textContent = 'Loading teams...';
        
        const teamsRes = await fetch('teams.json');
        if (!teamsRes.ok) throw new Error('teams.json not found');
        allTeams = (await teamsRes.json()).filter(t => t.team_name && t.team_name.trim());

        document.getElementById('loadingProgress').textContent = 'Loading players...';
        
        const playersRes = await fetch('players.json');
        if (!playersRes.ok) throw new Error('players.json not found');
        allPlayers = await playersRes.json();

        document.getElementById('loadingProgress').textContent = `Loaded ${allTeams.length} teams and ${allPlayers.length} players...`;

        // Store in localStorage
        localStorage.setItem('fifaAllTeams', JSON.stringify(allTeams));

        dataLoaded = true;

        setTimeout(() => {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('mainContainer').classList.add('visible');
            displayCurrentTeam();
        }, 400);

    } catch (e) {
        console.error(e);
        document.getElementById('loadingProgress').textContent = 'ERROR: ' + e.message;
        document.getElementById('loadingProgress').style.color = '#ff3366';
    }
}

// Display current team
function displayCurrentTeam() {
    if (!allTeams.length) return;
    const team = allTeams[currentIndex];

    // Flag
    const flagEl = document.getElementById('flagDisplay');
    const flag = countryFlags[team.country];
    if (flag) {
        flagEl.innerHTML = `<div style="font-size:6rem;">${flag}</div>`;
    } else {
        flagEl.innerHTML = '<div class="flag-placeholder">🏴</div>';
    }

    // Star rating (based on overall_rating)
    const rating = team.overall_rating || 70;
    const stars = Math.min(5, Math.max(1, Math.round(rating / 20)));
    const starHtml = Array(stars).fill('<span class="star">★</span>').join('') +
                     Array(5 - stars).fill('<span class="star" style="color:rgba(255,255,255,0.2);">★</span>').join('');
    document.getElementById('starRating').innerHTML = starHtml;

    // Stats (ATT/MID/DEF) - calculate from team rating or use defaults
    const att = team.attack || Math.floor(rating - 5 + Math.random() * 10);
    const mid = team.midfield || Math.floor(rating - 3 + Math.random() * 6);
    const def = team.defence || Math.floor(rating - 4 + Math.random() * 8);
    document.getElementById('attStat').textContent = att;
    document.getElementById('midStat').textContent = mid;
    document.getElementById('defStat').textContent = def;

    // Team name
    document.getElementById('teamNameDisplay').textContent = team.country || '—';
    document.getElementById('leagueDisplay').textContent = team.league_name || '—';
    document.getElementById('clubDisplay').textContent = team.team_name;

    // Finances (generate realistic values based on rating)
    const budget = Math.floor((rating / 100) * 150000000 + Math.random() * 50000000);
    const wages = Math.floor(budget * 0.04);
    document.getElementById('transferBudget').textContent = '$' + formatMoney(budget);
    document.getElementById('weeklyWages').textContent = '$' + formatMoney(wages);

    // Starting 11 (get top 11 players from this team)
    displayStarting11(team);
}

function formatMoney(val) {
    if (val >= 1000000) return (val / 1000000).toFixed(1) + 'M';
    if (val >= 1000) return (val / 1000).toFixed(0) + 'K';
    return val.toString();
}

function displayStarting11(team) {
    const teamPlayers = allPlayers.filter(p => p.club?.name === team.team_name);
    
    if (teamPlayers.length === 0) {
        document.getElementById('starting11List').innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:20px;">No player data available</div>';
        return;
    }

    // Sort by overall and take top 11
    const top11 = teamPlayers
        .sort((a, b) => {
            const ovrA = typeof a.basic_info?.overall === 'object' ? a.basic_info.overall.max : (a.basic_info?.overall || 0);
            const ovrB = typeof b.basic_info?.overall === 'object' ? b.basic_info.overall.max : (b.basic_info?.overall || 0);
            return ovrB - ovrA;
        })
        .slice(0, 11);

    // Render list
    const html = top11.map(p => {
        const pos = (p.player_positions || '').split(',')[0]?.trim() || 'SUB';
        let posClass = 'mid';
        if (pos === 'GK') posClass = 'gk';
        else if (['RB','LB','CB','RWB','LWB','RCB','LCB'].includes(pos)) posClass = 'def';
        else if (['ST','CF','LW','RW','CAM','LF','RF'].includes(pos)) posClass = 'att';
        
        const name = p.basic_info?.short_name || 'Unknown';
        
        return `<div class="player-row">
            <div class="position-badge ${posClass}">${pos}</div>
            <div class="player-name">${name}</div>
        </div>`;
    }).join('');

    document.getElementById('starting11List').innerHTML = html;
}

// Navigation
function nextTeam() {
    if (!dataLoaded || !allTeams.length) return;
    currentIndex = (currentIndex + 1) % allTeams.length;
    displayCurrentTeam();
}

function previousTeam() {
    if (!dataLoaded || !allTeams.length) return;
    currentIndex = (currentIndex - 1 + allTeams.length) % allTeams.length;
    displayCurrentTeam();
}

// Start game
function startGame() {
    if (!dataLoaded || !allTeams.length) {
        alert('Please wait for data to load!');
        return;
    }
    localStorage.setItem('fifaSelectedTeam', JSON.stringify(allTeams[currentIndex]));
    document.body.style.transition = 'opacity 0.5s';
    document.body.style.opacity = '0';
    setTimeout(() => {
        window.location.href = 'game.html';
    }, 500);
}

// Keyboard controls
document.addEventListener('keydown', e => {
    if (!dataLoaded) return;
    if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        startGame();
    } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        previousTeam();
    } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        nextTeam();
    }
});

loadAllData();
</script>
</body>
</html>
