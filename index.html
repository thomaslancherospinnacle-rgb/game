<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA Manager - Team Selection</title>
    
    <!-- Oxanium Font -->
    <link rel="stylesheet" href="https://use.typekit.net/iys5clu.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "oxanium", sans-serif;
            font-weight: 600;
            font-style: normal;
            background: url('background.jpg') center/cover fixed no-repeat;
            background-color: #0a0f19;
            color: white;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Dark overlay on background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(5, 10, 15, 0.75);
            z-index: 0;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.96);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-screen.hidden { display: none; }
        
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 217, 0, 0.2);
            border-top-color: #ffd900;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 30px;
            font-size: 1.8rem;
            color: #ffd900;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        .loading-progress {
            margin-top: 15px;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 60px;
            padding: 40px;
            opacity: 0;
            transition: opacity 0.6s;
        }
        .container.visible {
            opacity: 1;
        }

        /* LEFT PANEL - Team Selector */
        .team-selector {
            width: 480px;
            background: rgba(15, 20, 30, 0.92);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 217, 0, 0.25);
            border-radius: 12px;
            padding: 35px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
        }

        .selector-title {
            font-size: 2rem;
            font-weight: 900;
            color: #ffd900;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 35px;
            text-shadow: 0 2px 10px rgba(255, 217, 0, 0.5);
        }

        /* Flag Display Circle */
        .flag-display {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 30px;
            background: linear-gradient(135deg, rgba(20, 30, 45, 0.95), rgba(10, 15, 25, 0.95));
            border: 4px solid rgba(255, 217, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.6),
                inset 0 0 40px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .flag-display img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .flag-placeholder {
            font-size: 5rem;
            opacity: 0.5;
        }

        /* Star Rating */
        .star-rating {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .star {
            font-size: 2.6rem;
            color: #ffd900;
            text-shadow: 0 0 12px rgba(255, 217, 0, 0.6);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }
        
        .star.inactive {
            color: rgba(255, 255, 255, 0.15);
            text-shadow: none;
        }

        /* Team Stats (ATT/MID/DEF) */
        .team-stats {
            display: flex;
            gap: 18px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 12px 24px;
            min-width: 90px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            font-weight: 700;
        }
        
        .stat-value {
            font-size: 2.4rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* Team Name Selector with Arrows */
        .team-name-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 18px;
        }
        
        .arrow-btn {
            background: rgba(255, 217, 0, 0.12);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 217, 0, 0.35);
            color: #ffd900;
            width: 48px;
            height: 48px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.4rem;
            font-weight: 900;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .arrow-btn:hover {
            background: rgba(255, 217, 0, 0.25);
            border-color: #ffd900;
            transform: scale(1.08);
            box-shadow: 0 4px 16px rgba(255, 217, 0, 0.4);
        }
        
        .team-name-display {
            flex: 1;
            background: linear-gradient(135deg, rgba(180, 140, 0, 0.9), rgba(140, 100, 0, 0.9));
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            text-align: center;
            font-size: 1.7rem;
            font-weight: 900;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 16px rgba(255, 217, 0, 0.3);
        }

        /* League and Club Display */
        .league-club-display {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }
        
        .league-name {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        
        .club-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
        }

        /* Advance Button */
        .advance-btn {
            width: 100%;
            background: linear-gradient(135deg, #0096ff, #0066cc);
            border: none;
            color: #fff;
            font-family: "oxanium", sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s;
            box-shadow: 0 8px 24px rgba(0, 150, 255, 0.4);
        }
        
        .advance-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 150, 255, 0.6);
            background: linear-gradient(135deg, #00aaff, #0077dd);
        }

        /* RIGHT PANEL - Team Information */
        .team-info {
            width: 580px;
            background: rgba(15, 20, 30, 0.92);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 217, 0, 0.25);
            border-radius: 12px;
            padding: 35px 30px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-height: 85vh;
        }

        .info-title {
            font-size: 2rem;
            font-weight: 900;
            color: #ffd900;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(255, 217, 0, 0.5);
        }

        /* Finances Section */
        .finances-section {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 20px;
        }
        
        .finances-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 15px;
        }
        
        .finance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .finance-row:last-child {
            border-bottom: none;
        }
        
        .finance-label {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
        }
        
        .finance-value {
            font-size: 1.3rem;
            font-weight: 900;
            color: #39ff14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        /* Starting 11 Section */
        .starting-11-section {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }
        
        .starting-11-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 15px;
        }
        
        .starting-11-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .player-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 10px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .player-row:hover {
            background: rgba(255, 217, 0, 0.08);
            border-color: rgba(255, 217, 0, 0.3);
            transform: translateX(4px);
        }
        
        .position-badge {
            width: 44px;
            font-size: 0.8rem;
            font-weight: 900;
            color: #fff;
            text-align: center;
            padding: 4px 0;
            border-radius: 4px;
            flex-shrink: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .position-badge.gk {
            background: linear-gradient(135deg, #ffb400, #ff8800);
        }
        
        .position-badge.def {
            background: linear-gradient(135deg, #00c864, #009648);
        }
        
        .position-badge.mid {
            background: linear-gradient(135deg, #0096ff, #0066cc);
        }
        
        .position-badge.att {
            background: linear-gradient(135deg, #ff3264, #cc0032);
        }
        
        .player-name {
            flex: 1;
            font-size: 1.05rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Bottom Hints */
        .bottom-hints {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 35px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            padding: 12px 30px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .hint {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 700;
        }
        
        .hint-icon {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px;
            border-radius: 5px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        /* Scrollbar */
        .starting-11-section::-webkit-scrollbar {
            width: 8px;
        }
        
        .starting-11-section::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }
        
        .starting-11-section::-webkit-scrollbar-thumb {
            background: rgba(255, 217, 0, 0.4);
            border-radius: 4px;
        }
        
        .starting-11-section::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 217, 0, 0.6);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
                gap: 30px;
                padding: 20px;
                overflow-y: auto;
                height: auto;
                min-height: 100vh;
            }
            
            .team-selector,
            .team-info {
                width: 100%;
                max-width: 550px;
            }
            
            .flag-display {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>

<!-- Loading Screen -->
<div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div class="loading-text">LOADING FIFA MANAGER</div>
    <div class="loading-progress" id="loadingProgress">Initializing...</div>
</div>

<!-- Main Container -->
<div class="container" id="mainContainer">
    
    <!-- LEFT PANEL - Team Selector -->
    <div class="team-selector">
        <div class="selector-title">SELECT TEAM</div>
        
        <!-- Flag Display -->
        <div class="flag-display" id="flagDisplay">
            <div class="flag-placeholder">PLACEHOLDER</div>
        </div>

        <!-- Star Rating -->
        <div class="star-rating" id="starRating">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
        </div>

        <!-- Team Stats -->
        <div class="team-stats">
            <div class="stat-box">
                <div class="stat-label">ATT</div>
                <div class="stat-value" id="attStat">—</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">MID</div>
                <div class="stat-value" id="midStat">—</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">DEF</div>
                <div class="stat-value" id="defStat">—</div>
            </div>
        </div>

        <!-- Team Name Selector -->
        <div class="team-name-selector">
            <button class="arrow-btn" onclick="previousTeam()">◀</button>
            <div class="team-name-display" id="teamNameDisplay">—</div>
            <button class="arrow-btn" onclick="nextTeam()">▶</button>
        </div>

        <!-- League/Club Display -->
        <div class="league-club-display">
            <div class="league-name" id="leagueDisplay">—</div>
            <div class="club-name" id="clubDisplay">—</div>
        </div>

        <!-- Advance Button -->
        <button class="advance-btn" onclick="startGame()">⏩ ADVANCE</button>
    </div>

    <!-- RIGHT PANEL - Team Information -->
    <div class="team-info">
        <div class="info-title">TEAM INFORMATION</div>

        <!-- Finances -->
        <div class="finances-section">
            <div class="finances-title">FINANCES</div>
            <div class="finance-row">
                <div class="finance-label">Transfer Budget</div>
                <div class="finance-value" id="transferBudget">—</div>
            </div>
            <div class="finance-row">
                <div class="finance-label">Weekly Wages</div>
                <div class="finance-value" id="weeklyWages">—</div>
            </div>
        </div>

        <!-- Starting 11 -->
        <div class="starting-11-section">
            <div class="starting-11-title">STARTING 11</div>
            <div class="starting-11-list" id="starting11List">
                <div style="text-align:center;color:rgba(255,255,255,0.3);padding:30px;">Loading squad...</div>
            </div>
        </div>
    </div>
</div>

<!-- Bottom Hints -->
<div class="bottom-hints">
    <div class="hint">
        <div class="hint-icon">⏩</div>
        <span>Advance</span>
    </div>
    <div class="hint">
        <div class="hint-icon">◀ ▶</div>
        <span>Navigate</span>
    </div>
    <div class="hint">
        <div class="hint-icon">ESC</div>
        <span>Back</span>
    </div>
</div>

<script>
// Game State
let allTeams = [];
let allPlayers = [];
let currentIndex = 0;
let dataLoaded = false;

// Country to flag file mapping (will use flags folder later)
const countryToFile = {
    'England': 'england',
    'Spain': 'spain',
    'Germany': 'germany',
    'Italy': 'italy',
    'France': 'france',
    'Portugal': 'portugal',
    'Netherlands': 'netherlands',
    'Belgium': 'belgium',
    'Brazil': 'brazil',
    'Argentina': 'argentina',
    'United States': 'united-states',
    'Mexico': 'mexico',
    'Japan': 'japan',
    'South Korea': 'south-korea',
    'Australia': 'australia',
    'Saudi Arabia': 'saudi-arabia',
    'Turkey': 'turkey',
    'Poland': 'poland',
    'Scotland': 'scotland',
    'Wales': 'wales',
    'Austria': 'austria',
    'Switzerland': 'switzerland',
    'Denmark': 'denmark',
    'Sweden': 'sweden',
    'Norway': 'norway'
};

// Load data
async function loadAllData() {
    try {
        document.getElementById('loadingProgress').textContent = 'Loading teams...';
        
        const teamsRes = await fetch('teams.json');
        if (!teamsRes.ok) throw new Error('teams.json not found');
        allTeams = (await teamsRes.json()).filter(t => t.team_name && t.team_name.trim());

        document.getElementById('loadingProgress').textContent = 'Loading players...';
        
        const playersRes = await fetch('players.json');
        if (!playersRes.ok) throw new Error('players.json not found');
        allPlayers = await playersRes.json();

        document.getElementById('loadingProgress').textContent = `Loaded ${allTeams.length} teams and ${allPlayers.length} players...`;

        // Store in localStorage
        localStorage.setItem('fifaAllTeams', JSON.stringify(allTeams));

        dataLoaded = true;

        setTimeout(() => {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('mainContainer').classList.add('visible');
            displayCurrentTeam();
        }, 500);

    } catch (e) {
        console.error(e);
        document.getElementById('loadingProgress').textContent = 'ERROR: ' + e.message;
        document.getElementById('loadingProgress').style.color = '#ff3366';
    }
}

// Display current team
function displayCurrentTeam() {
    if (!allTeams.length) return;
    const team = allTeams[currentIndex];

    // Flag - try to load from flags folder, fallback to PLACEHOLDER
    const flagEl = document.getElementById('flagDisplay');
    const countryFile = countryToFile[team.country];
    
    if (countryFile) {
        // Try PNG first, then fallback to PLACEHOLDER
        const flagImg = new Image();
        flagImg.onerror = () => {
            flagEl.innerHTML = '<div class="flag-placeholder">PLACEHOLDER</div>';
        };
        flagImg.onload = () => {
            flagEl.innerHTML = `<img src="flags/${countryFile}.png" alt="${team.country}">`;
        };
        flagImg.src = `flags/${countryFile}.png`;
    } else {
        flagEl.innerHTML = '<div class="flag-placeholder">PLACEHOLDER</div>';
    }

    // Star rating
    const rating = team.overall_rating || 70;
    const stars = Math.min(5, Math.max(1, Math.round(rating / 20)));
    let starHtml = '';
    for (let i = 1; i <= 5; i++) {
        if (i <= stars) {
            starHtml += '<span class="star">★</span>';
        } else {
            starHtml += '<span class="star inactive">★</span>';
        }
    }
    document.getElementById('starRating').innerHTML = starHtml;

    // Stats (ATT/MID/DEF)
    const att = team.attack || Math.floor(rating - 5 + Math.random() * 10);
    const mid = team.midfield || Math.floor(rating - 3 + Math.random() * 6);
    const def = team.defence || Math.floor(rating - 4 + Math.random() * 8);
    
    document.getElementById('attStat').textContent = Math.max(40, Math.min(99, att));
    document.getElementById('midStat').textContent = Math.max(40, Math.min(99, mid));
    document.getElementById('defStat').textContent = Math.max(40, Math.min(99, def));

    // Team name
    document.getElementById('teamNameDisplay').textContent = team.country || '—';
    document.getElementById('leagueDisplay').textContent = team.league_name || '—';
    document.getElementById('clubDisplay').textContent = team.team_name;

    // Finances
    const budget = Math.floor((rating / 100) * 150000000 + Math.random() * 50000000);
    const wages = Math.floor(budget * 0.04);
    document.getElementById('transferBudget').textContent = '$' + formatMoney(budget);
    document.getElementById('weeklyWages').textContent = '$' + formatMoney(wages);

    // Starting 11
    displayStarting11(team);
}

function formatMoney(val) {
    if (val >= 1000000) return (val / 1000000).toFixed(1) + 'M';
    if (val >= 1000) return (val / 1000).toFixed(0) + 'K';
    return val.toString();
}

function displayStarting11(team) {
    const teamPlayers = allPlayers.filter(p => p.club?.name === team.team_name);
    
    if (teamPlayers.length === 0) {
        document.getElementById('starting11List').innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:30px;">No player data available</div>';
        return;
    }

    // Sort by overall and take top 11
    const top11 = teamPlayers
        .sort((a, b) => {
            const ovrA = a.ratings?.overall || 0;
            const ovrB = b.ratings?.overall || 0;
            return ovrB - ovrA;
        })
        .slice(0, 11);

    // Render list
    const html = top11.map(p => {
        const pos = (p.player_positions || '').split(',')[0]?.trim() || 'SUB';
        let posClass = 'mid';
        
        if (pos === 'GK') posClass = 'gk';
        else if (['RB','LB','CB','RWB','LWB','RCB','LCB'].includes(pos)) posClass = 'def';
        else if (['ST','CF','LW','RW','CAM','LF','RF'].includes(pos)) posClass = 'att';
        
        const name = p.basic_info?.short_name || 'Unknown';
        
        return `<div class="player-row">
            <div class="position-badge ${posClass}">${pos}</div>
            <div class="player-name">${name}</div>
        </div>`;
    }).join('');

    document.getElementById('starting11List').innerHTML = html;
}

// Navigation
function nextTeam() {
    if (!dataLoaded || !allTeams.length) return;
    currentIndex = (currentIndex + 1) % allTeams.length;
    displayCurrentTeam();
}

function previousTeam() {
    if (!dataLoaded || !allTeams.length) return;
    currentIndex = (currentIndex - 1 + allTeams.length) % allTeams.length;
    displayCurrentTeam();
}

// Start game
function startGame() {
    if (!dataLoaded || !allTeams.length) {
        alert('Please wait for data to load!');
        return;
    }
    localStorage.setItem('fifaSelectedTeam', JSON.stringify(allTeams[currentIndex]));
    document.body.style.transition = 'opacity 0.5s';
    document.body.style.opacity = '0';
    setTimeout(() => {
        window.location.href = 'game.html';
    }, 500);
}

// Keyboard controls
document.addEventListener('keydown', e => {
    if (!dataLoaded) return;
    
    if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        startGame();
    } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        previousTeam();
    } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        nextTeam();
    } else if (e.code === 'Escape') {
        e.preventDefault();
        // Could add back navigation if needed
    }
});

// Start loading
loadAllData();
</script>

</body>
